name-template: "WeChat-Notifier v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: "v"

category-template: "### $TITLE"
categories:
  - title: "🚨 重大变更 | Breaking Changes"
    exclusive: true
    when:
      conventional:
        breaking: true

  - title: "🚀 Features | 新特性"
    exclusive: true
    when:
      - conventional:
          types:
            - feat
      - labels:
          - feature
          - enhancement
          - feat

  - title: "🐛 Bug Fixes | 修复"
    exclusive: true
    when:
      - conventional:
          types:
            - fix
      - labels:
          - bug
          - bugfix
          - fix

  - title: "⚡ Performance & UX | 性能与体验优化"
    exclusive: true
    when:
      - conventional:
          types:
            - perf
      - labels:
          - performance
          - perf

  - title: "♻️ Refactoring | 代码重构"
    exclusive: true
    when:
      - conventional:
          types:
            - refactor
      - labels:
          - refactor

  - title: "📝 Documentation | 文档更新"
    exclusive: true
    when:
      - conventional:
          types:
            - docs
      - labels:
          - docs
          - documentation

  - title: "⏪ Reverts | 代码回滚"
    exclusive: true
    when:
      - conventional:
          types:
            - revert
      - labels:
          - revert

  - title: "🧰 Maintenance & CI | 内部维护与构建"
    exclusive: true
    when:
      - conventional:
          types:
            - build
            - chore
            - ci
            - style
            - test
      - labels:
          - build
          - chore
          - ci
          - dependencies
          - maintenance
          - style
          - test

  - title: "📦 其他更新"

  # --- 系统级拦截与版本号解析规则 ---
  - type: pre-exclude
    when:
      label: skip-changelog

  - type: version-resolver
    semver-increment: major
    when:
      - conventional:
          breaking: true
      - labels:
          - breaking
          - major

  - type: version-resolver
    semver-increment: minor
    when:
      - conventional:
          types:
            - feat
      - labels:
          - feature
          - enhancement
          - feat

  - type: version-resolver
    semver-increment: patch

change-template: "- $TITLE ([#$NUMBER]($URL))"
change-title-escapes: '\<*_&'
no-changes-template: "- 暂无合并 PR；正式发布时将根据提交记录整理更新内容。"
sort-by: merged_at
sort-direction: descending

template: |
  ## 更新内容

  $CHANGES

  ## 下载

  - Windows x64 安装程序：`WeChat-Notifier-Setup-x64.exe`。
  - Windows ARM64 安装程序：`WeChat-Notifier-Setup-arm64.exe`。
  - Windows AOT x64：`WeChat-Notifier-win-x64-aot.zip`
  - Windows AOT ARM64：`WeChat-Notifier-win-arm64-aot.zip`

  ## 安装

  - 安装版：根据 Windows 架构下载对应的安装程序，双击后按向导完成安装。
  - 压缩包：下载与 Windows 架构对应的文件，解压后运行 `WeChat-Notifier.exe`。
  - 配置和日志保存在程序目录；安装版默认位于 `%LOCALAPPDATA%\Programs\WeChat-Notifier`。
