name: Release WeChat-Notifier

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Update release draft
        uses: release-drafter/release-drafter@v7
        with:
          config-name: file:release-drafter.yml

  package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Native AOT package
        shell: pwsh
        run: ./build.ps1 -Architecture ${{ matrix.architecture }} -Aot
      - name: Upload AOT archive
        uses: actions/upload-artifact@v7
        with:
          name: Aot-${{ matrix.architecture }}
          path: dist/WeChat-Notifier-win-${{ matrix.architecture }}-aot.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download AOT archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Set up Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "安装 Inno Setup 失败，choco 退出码 $LASTEXITCODE。" }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw "找不到 Inno Setup 编译器：$compiler" }
      - name: Add Simplified Chinese installer language
        shell: pwsh
        run: |
          # Inno Setup 6.7.1 keeps this translation under its Unofficial directory.
          $languageDir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\Languages'
          New-Item -ItemType Directory -Path $languageDir -Force | Out-Null
          $languageFile = Join-Path $languageDir 'ChineseSimplified.isl'
          $languageUrl = 'https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl'
          Invoke-WebRequest -Uri $languageUrl -OutFile $languageFile -ErrorAction Stop
          if ((Get-Item -LiteralPath $languageFile).Length -lt 4096 -or
              !(Select-String -LiteralPath $languageFile -Pattern '^\[LangOptions\]$' -Quiet) -or
              !(Select-String -LiteralPath $languageFile -Pattern '^\[Messages\]$' -Quiet)) {
              throw '下载的 Inno Setup 简体中文语言文件无效。'
          }
      - name: Build architecture-specific Inno Setup installers
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:[-+].*)?$') {
              throw "发布 tag 必须符合 vMAJOR.MINOR.PATCH：$env:RELEASE_TAG"
          }
          $version = "$($Matches.major).$($Matches.minor).$($Matches.patch)"
          $releaseAssets = (Resolve-Path -LiteralPath 'release-assets').Path
          $sourceDirs = @{}
          foreach ($architecture in @('x64', 'arm64')) {
              $archive = Join-Path $releaseAssets "WeChat-Notifier-win-$architecture-aot.zip"
              if (!(Test-Path -LiteralPath $archive -PathType Leaf)) { throw "缺少 $architecture AOT 压缩包：$archive" }
              $source = Join-Path $env:RUNNER_TEMP "WeChat-Notifier-$architecture"
              New-Item -ItemType Directory -Path $source -Force | Out-Null
              Expand-Archive -LiteralPath $archive -DestinationPath $source -Force
              if (!(Test-Path -LiteralPath (Join-Path $source 'WeChat-Notifier.exe') -PathType Leaf)) {
                  throw "$architecture AOT 压缩包缺少 WeChat-Notifier.exe。"
              }
              $sourceDirs[$architecture] = $source
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $setupTargets = @(
              @{ Name = 'x64'; ArchitectureIdentifier = 'x64os' },
              @{ Name = 'arm64'; ArchitectureIdentifier = 'arm64' }
          )
          foreach ($target in $setupTargets) {
              & $compiler "/DAppVersion=$version" "/DAppArchitecture=$($target.Name)" `
                  "/DArchitectureIdentifier=$($target.ArchitectureIdentifier)" `
                  "/DPayloadDir=$($sourceDirs[$target.Name])" "/DOutputDir=$releaseAssets" `
                  'installer/WeChat-Notifier.iss'
              if ($LASTEXITCODE -ne 0) { throw "$($target.Name) Inno Setup 编译失败，ISCC 退出码 $LASTEXITCODE。" }
              $installer = Join-Path $releaseAssets "WeChat-Notifier-Setup-$($target.Name).exe"
              if (!(Test-Path -LiteralPath $installer -PathType Leaf)) {
                  throw "Inno Setup 编译未生成 $($target.Name) 安装程序。"
              }
          }
      - name: Publish Release Drafter notes
        uses: release-drafter/release-drafter@v7
        with:
          config-name: file:release-drafter.yml
          name: WeChat-Notifier ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          publish: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
      - name: Attach release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem release-assets -File | Where-Object Extension -In @('.zip', '.exe'))
          $expected = @(
              'WeChat-Notifier-win-x64-aot.zip',
              'WeChat-Notifier-win-arm64-aot.zip',
              'WeChat-Notifier-Setup-x64.exe',
              'WeChat-Notifier-Setup-arm64.exe'
          )
          if ($assets.Count -ne $expected.Count -or (Compare-Object $expected $assets.Name)) {
              throw "发布资产不完整：$($assets.Name -join ', ')"
          }
          & gh release upload $env:RELEASE_TAG $assets.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 附件失败，gh 退出码 $LASTEXITCODE。" }
